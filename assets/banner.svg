<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Grid Line Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.65"/>
    </pattern>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing accents -->
    <radialGradient id="glowG" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="85%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Cell Highlights -->
    <linearGradient id="cellActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.4"/>
    </linearGradient>

    <style>
      /* Animated Background Elements */
      @keyframes floatGrid {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.4deg); }
      }
      @keyframes pulseCell {
        0%, 100% { opacity: 0.35; stroke: #10b981; }
        50% { opacity: 0.95; stroke: #34d399; }
      }
      @keyframes scanbeam {
        0% { transform: translateY(-30px); opacity: 0; }
        50% { opacity: 0.6; }
        100% { transform: translateY(180px); opacity: 0; }
      }
      @keyframes cursorMove1 {
        0%, 100% { transform: translate(780px, 110px); }
        33% { transform: translate(890px, 150px); }
        66% { transform: translate(820px, 230px); }
      }
      @keyframes cursorMove2 {
        0%, 100% { transform: translate(960px, 220px); }
        40% { transform: translate(920px, 120px); }
        75% { transform: translate(1030px, 170px); }
      }
      @keyframes cursorMove3 {
        0%, 100% { transform: translate(840px, 200px); }
        50% { transform: translate(770px, 160px); }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pillBob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .bg-grid-mesh {
        animation: floatGrid 10s ease-in-out infinite;
      }
      .anim-cell {
        animation: pulseCell 3s ease-in-out infinite;
      }
      .anim-cursor-1 {
        animation: cursorMove1 8s ease-in-out infinite;
      }
      .anim-cursor-2 {
        animation: cursorMove2 10s ease-in-out infinite;
      }
      .anim-cursor-3 {
        animation: cursorMove3 9s ease-in-out infinite;
      }
      .anim-flow {
        stroke-dasharray: 12 8;
        animation: flowData 15s linear infinite;
      }
      .pill-1 { animation: pillBob 4s ease-in-out infinite; }
      .pill-2 { animation: pillBob 4.6s ease-in-out infinite 0.5s; }
      .pill-3 { animation: pillBob 5.2s ease-in-out infinite 1s; }
      .pill-4 { animation: pillBob 4.2s ease-in-out infinite 1.5s; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="12" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="12" fill="url(#glowG)"/>
  <rect width="1200" height="360" rx="12" fill="url(#glowB)"/>

  <!-- Background Matrix Grid Pattern -->
  <rect width="1200" height="360" rx="12" fill="url(#gridPattern)" opacity="0.45"/>

  <!-- Dynamic / Animated Interactive Spreadsheet Canvas (Right Side / Background) -->
  <g class="bg-grid-mesh" transform="translate(680, 50)">
    <!-- Spreadsheet Mock Card Background -->
    <rect x="50" y="30" width="430" height="230" rx="8" fill="#131d31" stroke="#334155" stroke-width="1.5" opacity="0.85"/>
    
    <!-- Table Header Row -->
    <rect x="50" y="30" width="430" height="30" rx="8" fill="#1e293b" opacity="0.9"/>
    <line x1="120" y1="30" x2="120" y2="260" stroke="#334155" stroke-width="1"/>
    <line x1="210" y1="30" x2="210" y2="260" stroke="#334155" stroke-width="1"/>
    <line x1="300" y1="30" x2="300" y2="260" stroke="#334155" stroke-width="1"/>
    <line x1="390" y1="30" x2="390" y2="260" stroke="#334155" stroke-width="1"/>

    <!-- Table Rows -->
    <line x1="50" y1="60" x2="480" y2="60" stroke="#334155" stroke-width="1"/>
    <line x1="50" y1="100" x2="480" y2="100" stroke="#334155" stroke-width="1"/>
    <line x1="50" y1="140" x2="480" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="50" y1="180" x2="480" y2="180" stroke="#334155" stroke-width="1"/>
    <line x1="50" y1="220" x2="480" y2="220" stroke="#334155" stroke-width="1"/>

    <!-- Column Headers -->
    <text x="85" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">A</text>
    <text x="165" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">B (Q1)</text>
    <text x="255" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">C (Q2)</text>
    <text x="345" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">D (Sync)</text>
    <text x="435" y="50" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">E (AI)</text>

    <!-- Simulated Data Bars &amp; Badges -->
    <rect x="62" y="74" width="45" height="12" rx="3" fill="#3b82f6" opacity="0.3"/>
    <rect x="135" y="74" width="60" height="12" rx="3" fill="#10b981" opacity="0.5"/>
    <rect x="225" y="74" width="50" height="12" rx="3" fill="#10b981" opacity="0.7"/>
    <rect x="315" y="74" width="40" height="12" rx="3" fill="#6366f1" opacity="0.4"/>
    <circle cx="435" cy="80" r="5" fill="#10b981"/>

    <rect x="62" y="114" width="50" height="12" rx="3" fill="#3b82f6" opacity="0.4"/>
    <rect x="135" y="114" width="40" height="12" rx="3" fill="#06b6d4" opacity="0.5"/>
    <rect x="225" y="114" width="65" height="12" rx="3" fill="#10b981" opacity="0.6"/>
    <rect x="315" y="114" width="55" height="12" rx="3" fill="#a855f7" opacity="0.4"/>
    <circle cx="435" cy="120" r="5" fill="#38bdf8"/>

    <rect x="62" y="154" width="40" height="12" rx="3" fill="#3b82f6" opacity="0.3"/>
    <rect x="135" y="154" width="55" height="12" rx="3" fill="#10b981" opacity="0.4"/>
    <rect x="225" y="154" width="45" height="12" rx="3" fill="#06b6d4" opacity="0.5"/>
    <rect x="315" y="154" width="48" height="12" rx="3" fill="#ec4899" opacity="0.4"/>
    <circle cx="435" cy="160" r="5" fill="#f59e0b"/>

    <!-- Active Selected Cell with pulsing glow -->
    <rect class="anim-cell" x="210" y="100" width="90" height="40" fill="url(#cellActiveGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="300" cy="140" r="3.5" fill="#10b981"/>

    <!-- Connecting Dynamic Flow Line -->
    <path class="anim-flow" d="M 120 180 Q 210 240, 300 140 T 420 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Multiplayer Live Presence Collaborative Cursors -->
  <!-- Cursor 1 (Emerald - Alice) -->
  <g class="anim-cursor-1">
    <path d="M 0 0 L 0 16 L 4.5 12.5 L 9 20 L 12 18.5 L 7.5 11.5 L 13.5 11 Z" fill="#10b981" stroke="#052e16" stroke-width="1.2"/>
    <rect x="14" y="8" width="56" height="18" rx="4" fill="#10b981"/>
    <text x="42" y="21" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Alice</text>
  </g>

  <!-- Cursor 2 (Indigo - Bob) -->
  <g class="anim-cursor-2">
    <path d="M 0 0 L 0 16 L 4.5 12.5 L 9 20 L 12 18.5 L 7.5 11.5 L 13.5 11 Z" fill="#6366f1" stroke="#1e1b4b" stroke-width="1.2"/>
    <rect x="14" y="8" width="50" height="18" rx="4" fill="#6366f1"/>
    <text x="39" y="21" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Bob</text>
  </g>

  <!-- Cursor 3 (Amber - Charlie) -->
  <g class="anim-cursor-3">
    <path d="M 0 0 L 0 16 L 4.5 12.5 L 9 20 L 12 18.5 L 7.5 11.5 L 13.5 11 Z" fill="#f59e0b" stroke="#451a03" stroke-width="1.2"/>
    <rect x="14" y="8" width="62" height="18" rx="4" fill="#f59e0b"/>
    <text x="45" y="21" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Charlie</text>
  </g>

  <!-- Left Foreground Content (Unobscured and Crystal Clear) -->
  <g transform="translate(70, 75)">
    <!-- Small Category Badge -->
    <g class="pill-1">
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="13" r="5" fill="#10b981"/>
      <text x="24" y="17" fill="#6ee7b7" font-size="11" font-weight="700" letter-spacing="0.6">CURATED AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" fill="url(#textGrad)" font-size="34" font-weight="900" letter-spacing="-0.5">
      Awesome Online Collaborative
    </text>
    <text x="0" y="115" fill="url(#textGrad)" font-size="34" font-weight="900" letter-spacing="-0.5">
      Spreadsheet
    </text>

    <!-- Subtitle -->
    <text x="0" y="152" fill="#94a3b8" font-size="14.5" font-weight="400">
      Real-Time Multiplayer Co-Authoring &#8226; Cloud SaaS &#8226; Self-Hosted Open-Source
    </text>
    <text x="0" y="174" fill="#64748b" font-size="13" font-weight="400">
      Database-Spreadsheet Hybrids &#8226; DuckDB Big Data Grids &#8226; Offline Sovereign Stacks
    </text>

    <!-- Feature Attribute Pills / Tags -->
    <g transform="translate(0, 198)">
      <!-- Pill 1 -->
      <g class="pill-1">
        <rect x="0" y="0" width="130" height="28" rx="14" fill="#132426" stroke="#059669" stroke-width="1"/>
        <text x="65" y="18" fill="#34d399" font-size="11.5" font-weight="600" text-anchor="middle">⚡ Real-Time CRDT</text>
      </g>
      <!-- Pill 2 -->
      <g class="pill-2" transform="translate(140, 0)">
        <rect x="0" y="0" width="115" height="28" rx="14" fill="#17223b" stroke="#2563eb" stroke-width="1"/>
        <text x="57.5" y="18" fill="#60a5fa" font-size="11.5" font-weight="600" text-anchor="middle">📊 Excel &amp; XLSX</text>
      </g>
      <!-- Pill 3 -->
      <g class="pill-3" transform="translate(265, 0)">
        <rect x="0" y="0" width="125" height="28" rx="14" fill="#221838" stroke="#7c3aed" stroke-width="1"/>
        <text x="62.5" y="18" fill="#c084fc" font-size="11.5" font-weight="600" text-anchor="middle">🛡️ Self-Hosted</text>
      </g>
      <!-- Pill 4 -->
      <g class="pill-4" transform="translate(400, 0)">
        <rect x="0" y="0" width="135" height="28" rx="14" fill="#2d1b24" stroke="#db2777" stroke-width="1"/>
        <text x="67.5" y="18" fill="#f472b6" font-size="11.5" font-weight="600" text-anchor="middle">🤖 AI &amp; Automations</text>
      </g>
    </g>
  </g>
</svg>
